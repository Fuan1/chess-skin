<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Chess Skin</title>
    <!-- CSS Style -->
    <style>
      /**
         * 1. Design Tokens (palette follows Chess.com's dark UI)
         */
      :root {
        --bg: #262421;
        --surface: #312e2b;
        --surface-raised: #3c3936;
        --border: #45423f;
        --text: #ffffff;
        --text-muted: #a8a6a3;
        --text-faint: #7a7876;
        --accent: #81b64c;
        --accent-hover: #95c962;
        --accent-shade: #45753c;
        --danger: #e2574c;
        --light-square: #ebecd0;
        --dark-square: #739552;
        --radius-sm: 6px;
        --radius: 10px;
        --transition: 0.15s ease;
      }

      /**
         * 2. Basic Layout
         */
      * {
        box-sizing: border-box;
      }

      body {
        width: 380px;
        margin: 0;
        font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        font-size: 13px;
        background-color: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        /* App-like UI: no text selection or image dragging */
        user-select: none;
        -webkit-user-select: none;
      }

      img,
      svg {
        -webkit-user-drag: none;
      }

      input[type="text"] {
        user-select: text;
        -webkit-user-select: text;
      }

      button {
        font: inherit;
        color: inherit;
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 16px;
        background-color: var(--surface);
        border-bottom: 1px solid var(--border);
      }

      .content {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 16px;
      }

      .footer {
        display: flex;
        justify-content: space-between;
        padding: 6px 16px;
        border-top: 1px solid var(--border);
        color: var(--text-faint);
        font-size: 11px;
      }

      /**
         * 3. Brand
         */
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }

      .brand-name {
        display: block;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .brand-sub {
        display: block;
        font-size: 11px;
        color: var(--text-muted);
      }

      /**
         * 4. Switches
         */
      .switch {
        position: relative;
        display: inline-block;
        flex-shrink: 0;
        width: 36px;
        height: 20px;
      }

      .switch input {
        position: absolute;
        inset: 0;
        opacity: 0;
        margin: 0;
        cursor: pointer;
      }

      .switch-track {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background-color: #575451;
        transition: background-color var(--transition);
        pointer-events: none;
      }

      .switch-track::before {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background-color: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        transition: transform var(--transition);
      }

      .switch input:checked + .switch-track {
        background-color: var(--accent);
      }

      .switch input:checked + .switch-track::before {
        transform: translateX(16px);
      }

      .switch input:focus-visible + .switch-track {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .switch-lg {
        width: 44px;
        height: 24px;
      }

      .switch-lg .switch-track::before {
        width: 20px;
        height: 20px;
      }

      .switch-lg input:checked + .switch-track::before {
        transform: translateX(20px);
      }

      .master-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }

      .status-label {
        min-width: 22px;
        font-size: 12px;
        font-weight: 600;
        text-align: right;
        color: var(--accent);
      }

      .skin-off .status-label {
        color: var(--text-faint);
      }

      /**
         * 5. Skin Showcase
         */
      .showcase {
        padding: 10px;
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }

      .showcase-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 4px 8px;
      }

      .skin-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 16px;
        font-weight: 700;
        min-width: 0;
      }

      .skin-counter {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--text-muted);
      }

      .chessboard-container {
        display: grid;
        grid-template-columns: 32px 1fr 32px;
        align-items: center;
        gap: 10px;
      }

      .chessboard {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: var(--radius-sm);
        overflow: hidden;
        background-color: var(--dark-square);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
        transition: filter 0.25s ease, opacity 0.25s ease;
      }

      .chess-square {
        display: flex;
        justify-content: center;
        align-items: center;
        aspect-ratio: 1 / 1;
      }

      .light-square {
        background-color: var(--light-square);
      }

      .dark-square {
        background-color: var(--dark-square);
      }

      .chess-piece {
        width: 84%;
        height: 84%;
        object-fit: contain;
      }

      /**
         * 6. Navigation Controls
         */
      .nav-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 50%;
        background-color: var(--surface-raised);
        color: var(--text-muted);
        cursor: pointer;
        transition: background-color var(--transition), color var(--transition);
      }

      .nav-button:hover {
        background-color: #4b4845;
        color: var(--text);
      }

      .nav-button svg {
        width: 16px;
        height: 16px;
      }

      /**
         * 7. Pagination
         */
      .pagination {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin-top: 10px;
      }

      .dot {
        width: 6px;
        height: 6px;
        padding: 0;
        border: none;
        border-radius: 999px;
        background-color: #5a5754;
        cursor: pointer;
        transition: width var(--transition), background-color var(--transition);
      }

      .dot:hover {
        background-color: var(--text-muted);
      }

      .dot.active {
        width: 18px;
        background-color: var(--accent);
      }

      /**
         * 8. Piece Strip
         */
      .piece-selection {
        display: flex;
        justify-content: space-between;
        padding: 6px 14px;
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        transition: filter 0.25s ease, opacity 0.25s ease;
      }

      .piece-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }

      .piece-selection .chess-piece {
        width: 30px;
        height: 30px;
      }

      .piece-name {
        font-size: 10px;
        color: var(--text-muted);
      }

      .skin-off .chessboard,
      .skin-off .piece-selection {
        filter: grayscale(0.85);
        opacity: 0.5;
      }

      /**
         * 9. Settings and Actions
         */
      .settings {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .setting {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 10px 9px 12px;
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        cursor: pointer;
      }

      .setting-icon {
        width: 16px;
        height: 16px;
        color: var(--text-muted);
        flex-shrink: 0;
      }

      .setting-label {
        flex: 1;
        font-weight: 600;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 38px;
        padding: 0 16px;
        border: none;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color var(--transition),
          transform var(--transition), box-shadow var(--transition);
      }

      .btn svg {
        width: 16px;
        height: 16px;
      }

      .btn-primary {
        background-color: var(--accent);
        box-shadow: 0 3px 0 var(--accent-shade);
      }

      .btn-primary:hover {
        background-color: var(--accent-hover);
      }

      .btn-primary:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 var(--accent-shade);
      }

      .btn-primary:disabled {
        background-color: #4b4845;
        box-shadow: 0 3px 0 #33302d;
        color: var(--text-faint);
        cursor: not-allowed;
        transform: none;
      }

      .btn-secondary {
        background-color: var(--surface-raised);
        box-shadow: 0 3px 0 #2a2725;
        color: var(--text-muted);
      }

      .btn-secondary:hover {
        background-color: #4b4845;
        color: var(--text);
      }

      .btn-secondary:active {
        transform: translateY(2px);
        box-shadow: 0 1px 0 #2a2725;
      }

      /**
         * 10. Modal and Upload Form
         */
      .modal {
        display: none;
        position: fixed;
        z-index: 100;
        top: 0;
        left: 0;
        width: 380px;
        height: 100%;
        padding: 12px;
        background-color: rgba(0, 0, 0, 0.6);
      }

      .modal-content {
        max-height: 100%;
        overflow-y: auto;
        padding: 16px;
        background-color: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      }

      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .modal-head h2 {
        margin: 0;
        font-size: 16px;
      }

      .close {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: none;
        color: var(--text-muted);
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
      }

      .close:hover {
        background-color: var(--surface-raised);
        color: var(--text);
      }

      .upload-info {
        margin-bottom: 12px;
      }

      .upload-info h3 {
        margin: 12px 0 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-muted);
      }

      .upload-info h3:first-child {
        margin-top: 0;
      }

      .upload-info h3 span {
        font-weight: 500;
        letter-spacing: 0;
        text-transform: none;
        color: var(--text-faint);
      }

      .file-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .file-chip {
        padding: 2px 6px;
        border-radius: 4px;
        background-color: var(--surface-raised);
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
        color: var(--text-muted);
      }

      .file-chip.found {
        background-color: rgba(129, 182, 76, 0.18);
        color: var(--accent-hover);
      }

      .file-chip.found::before {
        content: "✓ ";
      }

      .file-chip.missing {
        background-color: rgba(226, 87, 76, 0.16);
        color: #f0948b;
      }

      .size-guide {
        margin-top: 12px;
        color: var(--text-muted);
      }

      .size-guide summary {
        font-size: 12px;
        cursor: pointer;
      }

      .size-guide summary:hover {
        color: var(--text);
      }

      .size-list {
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
        color: var(--text-muted);
        line-height: 1.6;
      }

      .upload-message {
        min-height: 18px;
        margin: 0 0 10px;
        font-size: 12px;
        color: var(--text-muted);
      }

      .upload-message.error {
        color: #f0948b;
      }

      .upload-message.ok {
        color: var(--accent-hover);
      }

      .size-list strong {
        color: var(--text);
        font-weight: 600;
      }

      .form-group {
        margin-bottom: 12px;
      }

      .form-group > label:not(.custom-file-upload) {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }

      .form-group input[type="text"] {
        width: 100%;
        height: 36px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background-color: var(--bg);
        color: var(--text);
        font: inherit;
      }

      .form-group input[type="text"]:focus {
        outline: none;
        border-color: var(--accent);
      }

      .custom-file-upload {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        text-align: center;
        padding: 14px 12px;
        border: 1px dashed #5f5c59;
        border-radius: var(--radius-sm);
        background-color: var(--bg);
        color: var(--text-muted);
        cursor: pointer;
        transition: border-color var(--transition), color var(--transition);
      }

      .custom-file-upload:hover,
      .custom-file-upload.has-files {
        border-color: var(--accent);
        color: var(--text);
      }

      .custom-file-upload.has-files {
        border-style: solid;
      }

      .custom-file-upload svg {
        display: block;
        width: 22px;
        height: 22px;
      }

      .file-upload-title {
        font-weight: 600;
      }

      input[type="file"] {
        display: none;
      }

      #file-upload-status {
        font-size: 11px;
        color: var(--text-faint);
      }

      .has-files #file-upload-status {
        color: var(--text-muted);
      }

      #submit-upload {
        width: 100%;
      }

      /**
         * 11. Delete Button Style
         */
      .delete-button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background-color: transparent;
        color: var(--text-faint);
        font-size: 12px;
        cursor: pointer;
        transition: background-color var(--transition), color var(--transition);
      }

      .delete-button:hover {
        background-color: var(--danger);
        color: #fff;
      }
    </style>
  </head>

  <body>
    <!-- Header Area -->
    <header class="header">
      <div class="brand">
        <img
          src="icons/icon48.png"
          class="brand-mark"
          alt=""
          draggable="false"
        />
        <div>
          <span class="brand-name">Chess Skin</span>
          <span class="brand-sub">Piece &amp; sound themes for Chess.com</span>
        </div>
      </div>
      <label class="master-toggle">
        <span class="status-label" id="skin-status">On</span>
        <span class="switch switch-lg">
          <input
            type="checkbox"
            id="skin-toggle"
            checked
            aria-label="Enable skins"
          />
          <span class="switch-track"></span>
        </span>
      </label>
    </header>

    <main class="content">
      <!-- Skin Preview Area -->
      <section class="showcase">
        <div class="showcase-head">
          <div class="skin-title" id="current-skin-title"></div>
          <span class="skin-counter" id="skin-counter"></span>
        </div>

        <div class="chessboard-container">
          <button class="nav-button" id="prev-skin" aria-label="Previous skin">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5" /></svg>
          </button>
          <div class="chessboard" id="preview-board">
            <!-- Chessboard is dynamically created with JavaScript -->
          </div>
          <button class="nav-button" id="next-skin" aria-label="Next skin">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3 5 5-5 5" /></svg>
          </button>
        </div>

        <!-- Pagination (Skin Selection Dots) -->
        <div class="pagination" id="skin-pagination">
          <!-- Pagination dots are dynamically created with JavaScript -->
        </div>
      </section>

      <!-- Piece Preview Area -->
      <div class="piece-selection" id="piece-selection">
        <!-- Piece selection area is dynamically created with JavaScript -->
      </div>

      <!-- Settings -->
      <div class="settings">
        <label class="setting">
          <svg class="setting-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6v4h2.5l3.5 3V3L5 6z" /><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.5a6 6 0 0 1 0 9" /></svg>
          <span class="setting-label">Sound</span>
          <span class="switch">
            <input type="checkbox" id="sound-toggle" checked />
            <span class="switch-track"></span>
          </span>
        </label>
        <label class="setting">
          <svg class="setting-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="1.5" /><path d="M2 8h12M8 2v12" /><path d="M2 2h6v6H2zM8 8h6v6H8z" fill="currentColor" fill-opacity="0.35" stroke="none" /></svg>
          <span class="setting-label">Board</span>
          <span class="switch">
            <input type="checkbox" id="map-toggle" checked />
            <span class="switch-track"></span>
          </span>
        </label>
      </div>

      <!-- Control Buttons Area -->
      <div class="actions">
        <button id="apply-skin" class="btn btn-primary">Apply skin</button>
        <button id="upload-skin" class="btn btn-secondary">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10.5V2.5M4.75 5.75 8 2.5l3.25 3.25M2.5 10v2.5a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V10" /></svg>
          Upload
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span id="version"></span>
      <span>Chess Skin Changer</span>
    </footer>

    <!-- Upload Modal -->
    <div id="upload-modal" class="modal">
      <div class="modal-content">
        <div class="modal-head">
          <h2>Upload custom skin</h2>
          <button class="close" aria-label="Close">&times;</button>
        </div>

        <!-- Upload Form -->
        <div class="upload-form">
          <div class="form-group">
            <label class="custom-file-upload" tabindex="0">
              <input
                type="file"
                id="folder-upload"
                webkitdirectory
                directory
                multiple
              />
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.5 5.5a1 1 0 0 1 1-1h4l1.5 2h7.5a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1z" /></svg>
              <span class="file-upload-title">Choose skin folder</span>
              <span id="file-upload-status">PNG files named like wk.png, bq.png</span>
            </label>
          </div>
          <div class="form-group">
            <label for="skin-name">Skin name</label>
            <input
              type="text"
              id="skin-name"
              placeholder="Filled in from the folder name"
              autocomplete="off"
            />
          </div>
        </div>

        <!-- File Checklist (filled by JavaScript) -->
        <div class="upload-info">
          <h3>Required <span id="required-count">· 12 piece images</span></h3>
          <div class="file-chips" id="required-files"></div>

          <h3>Optional <span>· board images</span></h3>
          <div class="file-chips" id="optional-files"></div>

          <details class="size-guide">
            <summary>Image size guide</summary>
            <ul class="size-list">
              <li><strong>Pieces</strong> 150 × 150 px</li>
              <li><strong>Squares</strong> (bright, dark) 200 × 200 px</li>
              <li><strong>Board</strong> (grid) 1600 × 1600 px</li>
            </ul>
          </details>
        </div>

        <p class="upload-message" id="upload-message" role="status"></p>
        <button id="submit-upload" class="btn btn-primary" disabled>
          Upload skin
        </button>
      </div>
    </div>

    <!-- JavaScript -->
    <script src="popup.js"></script>
  </body>
</html>
